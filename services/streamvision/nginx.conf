server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Video uploads go through /api/videos
    client_max_body_size 1024m;

    # Douyin import depends on Windows Chrome + anaconda python; not available in a Pod.
    location = /api/videos/import-douyin {
        default_type application/json;
        return 403 '{"detail":"douyin import is disabled in the k8s deployment"}';
    }

    location /api/ {
        proxy_pass http://streamvision-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # VLM analysis and frame extraction can take minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
