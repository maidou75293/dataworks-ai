# ============================================================================
# dependabot.yml — 依赖升级机器人（REQ-OSS-CI2-1，审计 §四 五条之⑤）
# 三个生态对应仓内实际构建面：backend=Maven(pom.xml)、web=npm(package.json+lock)、
# github-actions=workflow 里 uses 的 action 版本。目录写相对仓根。
# ============================================================================
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
