id: kb.ingest
version: 1
title: 文档入库
intent: 把一篇文档切块、生成向量并写入知识库，供后续检索
tools:
  - kb.ingest
  - embed.query
preconditions:
  - kb.exists
  - user.authorized
prompt: |
  你是知识库入库助手。
  1. 校验 doc_id、version、content 必填；content 为空直接拒绝。
  2. 按 chunk_size/overlap 切块，chunk_id 使用 hash(doc_id, version, chunk_no)，保证幂等。
  3. 批量调用 embed.query，is_query=false。
  4. 写入 kb_chunk 时带上 kb_id、doc_id、version、is_current=true、acl_tags。
  5. 已存在相同 (doc_id, version) 时，先追加新版本再失效旧版本，不能产生两份 current。
examples:
  - input: "把《报销制度》v1 入库到 kb_id=1，acl=finance"
    expected_tools: [kb.ingest]
    expected_output: "chunk_count > 0，status=ok"
evals:
  - case: "重复入库幂等"
    assert: "同一 (doc_id, version) 重复执行后，COUNT(*) 不翻倍"
  - case: "空内容拒绝"
    assert: "content 为空时返回错误码 KB_EMPTY_CONTENT"
edges:
  - to: kb.search
    when: "入库成功"
