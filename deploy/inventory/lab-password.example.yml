# 密码模式示例：接管还没推公钥的机器。
#
#   cp inventory/lab-password.example.yml inventory/lab-password.yml
#   cp inventory/group_vars/vault.example.yml inventory/group_vars/vault.yml
#   ansible-vault encrypt inventory/group_vars/vault.yml   # 填 vault_ssh_password
#   ansible-playbook site.yml -i inventory/lab-password.yml --ask-vault-pass
#
# 前置：
#   - 控制机装了 sshpass（bootstrap-control.sh 已装）
#   - 目标机 sshd 允许 PasswordAuthentication
#   - root 密码登录通常被禁用（PermitRootLogin without-password），
#     所以密码模式用 ubuntu 账号 + sudo 密码，不要用 root

all:
  vars:
    ansible_user: ubuntu
    ansible_password: "{{ vault_ssh_password }}"
    ansible_become_password: "{{ vault_ssh_password }}"
    ansible_python_interpreter: /usr/bin/python3
    cluster_name: lab

  children:
    k3s_cluster:
      children:
        k3s_servers:
          children:
            k3s_init:
              hosts:
                k8s-node-1:
                  ansible_host: 192.0.2.11
                  k3s_node_ip: 192.0.2.11
            k3s_join:
              hosts:
                k8s-node-2:
                  ansible_host: 192.0.2.12
                  k3s_node_ip: 192.0.2.12
                k8s-node-3:
                  ansible_host: 192.0.2.13
                  k3s_node_ip: 192.0.2.13
        k3s_agents:
          hosts: {}
