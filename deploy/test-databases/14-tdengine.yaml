# TDengine 3.3，用于时序库连接器真实同步验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-tdengine
---
apiVersion: v1
kind: Service
metadata:
  name: tdengine
  namespace: dataworks-test-tdengine
spec:
  type: NodePort
  selector:
    app: tdengine
  ports:
    - name: native
      port: 6030
      targetPort: 6030
    - name: rest
      port: 6041
      targetPort: 6041
      nodePort: 30041
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdengine
  namespace: dataworks-test-tdengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdengine
  template:
    metadata:
      labels:
        app: tdengine
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node-2
      containers:
        - name: tdengine
          image: docker.io/tdengine/tdengine:3.3.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TAOS_FQDN
              value: localhost
          ports:
            - containerPort: 6030
            - containerPort: 6041
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/taos
      volumes:
        - name: data
          emptyDir: {}
