# RabbitMQ 3.13（management），用于连接器真实同步验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: dataworks-test-rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: dataworks-test-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node-3
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: test
            - name: RABBITMQ_DEFAULT_PASS
              value: test123
          ports:
            - containerPort: 5672
            - containerPort: 15672
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          emptyDir: {}
