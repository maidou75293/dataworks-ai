# Qdrant v1.9.0，用于向量库连接器真实同步验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: dataworks-test-qdrant
spec:
  type: NodePort
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      nodePort: 30633
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: dataworks-test-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      nodeSelector:
        kubernetes.io/hostname: dw-k8s-3
      containers:
        - name: qdrant
          image: docker.io/qdrant/qdrant:v1.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
            - containerPort: 6334
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      volumes:
        - name: data
          emptyDir: {}
