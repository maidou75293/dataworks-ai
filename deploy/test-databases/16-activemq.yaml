# ActiveMQ Classic 5.18（OpenWire 61616 + Web 8161），用于 MQ 汇端验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-activemq
---
apiVersion: v1
kind: Service
metadata:
  name: activemq
  namespace: dataworks-test-activemq
spec:
  selector:
    app: activemq
  ports:
    - name: openwire
      port: 61616
      targetPort: 61616
    - name: web
      port: 8161
      targetPort: 8161
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activemq
  namespace: dataworks-test-activemq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activemq
  template:
    metadata:
      labels:
        app: activemq
    spec:
      nodeSelector:
        kubernetes.io/hostname: dw-k8s-3
      containers:
        - name: activemq
          image: docker.io/apache/activemq-classic:5.18.3
          imagePullPolicy: IfNotPresent
          env:
            - name: ACTIVEMQ_ADMIN_LOGIN
              value: admin
            - name: ACTIVEMQ_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 61616
            - containerPort: 8161
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/apache-activemq/data
      volumes:
        - name: data
          emptyDir: {}
