# HTTP 连接器测试服务：busybox httpd 提供静态 JSON。
# 手工 kubectl 先渲染占位：sed 's|${DW_REGISTRY}|<你的仓库>|g' 本文件 | k3s kubectl apply -f -
#（同 01-mysql.yaml；REQ-OSS-PUBSCRUB-1）
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: http-test-data
  namespace: dataworks-test-http
data:
  assets.json: |
    {"code":200,"data":[{"id":1,"name":"http-a","size_bytes":101},{"id":2,"name":"http-b","size_bytes":202},{"id":3,"name":"http-c","size_bytes":303}],"success":true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-test
  namespace: dataworks-test-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-test
  template:
    metadata:
      labels:
        app: http-test
    spec:
      containers:
        - name: httpd
          image: docker.io/rancher/mirrored-library-busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: www
              mountPath: /www
              readOnly: true
      volumes:
        - name: www
          configMap:
            name: http-test-data
---
apiVersion: v1
kind: Service
metadata:
  name: http-test
  namespace: dataworks-test-http
spec:
  selector:
    app: http-test
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# HTTP 汇（webhook）测试服务：把 POST body 追加到 /data/out.log。
apiVersion: v1
kind: ConfigMap
metadata:
  name: http-echo-script
  namespace: dataworks-test-http
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class H(BaseHTTPRequestHandler):
        def do_POST(self):
            n = int(self.headers.get('Content-Length', '0'))
            body = self.rfile.read(n)
            with open('/data/out.log', 'ab') as f:
                f.write(body + b'\n')
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b'ok')

        def log_message(self, *args):
            pass

    HTTPServer(('0.0.0.0', 8081), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  namespace: dataworks-test-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-echo
  template:
    metadata:
      labels:
        app: http-echo
    spec:
      nodeSelector:
        kubernetes.io/hostname: dw-k8s-3
      containers:
        - name: server
          image: ${DW_REGISTRY}/base/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: http-echo-script
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: http-echo
  namespace: dataworks-test-http
spec:
  selector:
    app: http-echo
  ports:
    - name: http
      port: 8081
      targetPort: 8081
