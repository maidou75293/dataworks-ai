# IoTDB 1.3.3 standalone（config node + data node），用于源/汇端到端验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-iotdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iotdb
  namespace: dataworks-test-iotdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iotdb
  template:
    metadata:
      labels:
        app: iotdb
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node-3
      containers:
        - name: iotdb
          image: docker.io/apache/iotdb:1.3.3-standalone
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "/iotdb/sbin/start-standalone.sh; sleep infinity"]
          ports:
            - containerPort: 6667
              name: rpc
            - containerPort: 10710
              name: cn
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /iotdb/data
            - name: logs
              mountPath: /iotdb/logs
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: iotdb
  namespace: dataworks-test-iotdb
spec:
  selector:
    app: iotdb
  ports:
    - name: rpc
      port: 6667
      targetPort: 6667
