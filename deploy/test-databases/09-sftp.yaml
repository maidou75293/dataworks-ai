# SFTP 测试服务（atmoz/sftp），用于文件连接器真实同步验证。
# SeaTunnel 2.3.9 内置 JSch 较老，需要服务端开启 ssh-rsa / group14-sha1 等算法。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-sftp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sshd-config
  namespace: dataworks-test-sftp
data:
  sshd_config: |
    Port 22
    HostKey /etc/ssh/ssh_host_rsa_key
    HostKey /etc/ssh/ssh_host_ed25519_key
    PasswordAuthentication yes
    PermitRootLogin no
    Subsystem sftp internal-sftp
    KexAlgorithms +diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
    HostKeyAlgorithms +ssh-rsa
    PubkeyAcceptedAlgorithms +ssh-rsa
    Ciphers +aes128-cbc,3des-cbc
    # SeaTunnel 2.3.9 的 SFTP 汇在 rename 前会 cd("/")，必须把用户 chroot 到 home，
    # 否则相对路径会落到容器根目录（/upload 不存在）导致 rename 失败。
    Match User test
        ChrootDirectory /home/test
        ForceCommand internal-sftp
---
apiVersion: v1
kind: Service
metadata:
  name: sftp
  namespace: dataworks-test-sftp
spec:
  selector:
    app: sftp
  ports:
    - name: sftp
      port: 22
      targetPort: 22
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp
  namespace: dataworks-test-sftp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sftp
  template:
    metadata:
      labels:
        app: sftp
    spec:
      nodeSelector:
        kubernetes.io/hostname: dw-k8s-2
      containers:
        - name: sftp
          image: docker.io/atmoz/sftp:alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: SFTP_USERS
              value: test:test123:::upload
          ports:
            - containerPort: 22
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /home/test/upload
            - name: sshd
              mountPath: /etc/ssh/sshd_config
              subPath: sshd_config
      volumes:
        - name: data
          emptyDir: {}
        - name: sshd
          configMap:
            name: sshd-config
