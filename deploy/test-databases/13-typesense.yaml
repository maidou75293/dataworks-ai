# Typesense 27.0，用于搜索连接器真实同步验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-typesense
---
apiVersion: v1
kind: Service
metadata:
  name: typesense
  namespace: dataworks-test-typesense
spec:
  selector:
    app: typesense
  ports:
    - name: http
      port: 8108
      targetPort: 8108
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: typesense
  namespace: dataworks-test-typesense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typesense
  template:
    metadata:
      labels:
        app: typesense
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node-3
      containers:
        - name: typesense
          image: docker.io/typesense/typesense:27.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TYPESENSE_API_KEY
              value: test123
            - name: TYPESENSE_DATA_DIR
              value: /data
          ports:
            - containerPort: 8108
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
