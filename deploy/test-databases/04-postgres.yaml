apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: dataworks-test-postgres
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS workflow (
      id INT PRIMARY KEY,
      code TEXT NOT NULL,
      name TEXT NOT NULL
    );
    INSERT INTO workflow (id, code, name) VALUES
      (901, 'sync_pg_1', 'PG row 1'),
      (902, 'sync_pg_2', 'PG row 2'),
      (903, 'sync_pg_3', 'PG row 3');

    CREATE TABLE IF NOT EXISTS multimodal_asset (
      project_id BIGINT NOT NULL,
      dataset TEXT NOT NULL,
      asset_type TEXT NOT NULL,
      uri TEXT NOT NULL,
      file_name TEXT,
      mime_type TEXT,
      size_bytes BIGINT,
      sha256 TEXT
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dataworks-test-postgres
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dataworks-test-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: dw-k8s-3
      containers:
        - name: postgres
          image: ${DW_REGISTRY}/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # Postgres-CDC 需要逻辑复制；测试实例直接打开。
          args:
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
          env:
            - name: POSTGRES_PASSWORD
              value: test123
            - name: POSTGRES_DB
              value: sync_test
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: data
          emptyDir: {}
