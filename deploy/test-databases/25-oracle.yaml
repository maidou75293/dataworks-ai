# Oracle Free 23-slim，用于 JDBC 连接器端到端验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-oracle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: dataworks-test-oracle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      nodeSelector:
        kubernetes.io/hostname: dw-k8s-3
      containers:
        - name: oracle
          image: docker.io/gvenzl/oracle-free:23-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: ORACLE_PASSWORD
              value: test123
            - name: ORACLE_CHARACTERSET
              value: AL32UTF8
          ports:
            - containerPort: 1521
          resources:
            requests:
              cpu: 10m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: dataworks-test-oracle
spec:
  selector:
    app: oracle
  ports:
    - name: sql
      port: 1521
      targetPort: 1521
