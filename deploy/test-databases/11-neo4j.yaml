# Neo4j 5.20 单节点，用于连接器真实同步验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-neo4j
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: dataworks-test-neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: dataworks-test-neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # Kubernetes 会注入 NEO4J_PORT_7687_TCP_PORT 之类的环境变量，
      # Neo4j 会把它们当成配置项并在严格校验下启动失败。
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: dw-k8s-3
      containers:
        - name: neo4j
          image: docker.io/library/neo4j:5.20
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              value: neo4j/test12345
          ports:
            - containerPort: 7687
            - containerPort: 7474
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
