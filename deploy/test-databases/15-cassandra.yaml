# Cassandra 4.1 单节点，用于宽表连接器真实同步验证。
apiVersion: v1
kind: Namespace
metadata:
  name: dataworks-test-cassandra
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: dataworks-test-cassandra
spec:
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: dataworks-test-cassandra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node-2
      containers:
        - name: cassandra
          image: docker.io/library/cassandra:4.1
          imagePullPolicy: IfNotPresent
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: TestCluster
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 100M
          ports:
            - containerPort: 9042
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
      volumes:
        - name: data
          emptyDir: {}
