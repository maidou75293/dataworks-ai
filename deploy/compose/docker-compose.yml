# 数据中台 · 单机演示形态（REQ-OSS-QUICKSTART-1）
#
# 六件套：postgres + keycloak + s3(SeaweedFS) + doris + backend + web
# 另有两个一次性初始化 Job（keycloak-bootstrap / doris-init），跑完即退。
#
# 两种跑法：
#   1) bash up.sh            —— 一键：随机生成本机口令 → 构建 → 起栈 → 等健康 → 打印一次性 admin 口令
#   2) docker compose up -d  —— 直接起（用本文件里的 demo-* 兜底口令，README 有安全说明）
#
# 入口：http://localhost:30090  （web=nginx 托管前端并反代 /api → backend）
name: dataworks-demo

x-backend-env: &backend-env
  # —— 平台元数据库（/api/health 的唯一硬依赖）——
  SERVER_PORT: "8080"
  SPRING_FLYWAY_OUT_OF_ORDER: "true"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-dataworks_dev}
  DB_USER: ${DB_USER:-dataworks}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-demo-pg-pass}
  # —— 数仓（内置 Doris，项目建库/查询）——
  DORIS_HOST: doris
  DORIS_PORT: "9030"
  DORIS_USER: ${DB_USER:-dataworks}
  DORIS_PASSWORD: ${DORIS_PASSWORD:-demo-doris-pass}
  # —— 对象存储（项目存储前缀 / 多模态资产预签名）——
  S3_ENDPOINT: http://s3:9000
  S3_BUCKET: warehouse
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-demoaccesskey}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-demosecretkey123}
  ASSET_S3_PUBLIC_ENDPOINT: http://localhost:30900
  # —— 身份（realm dataworks；本地 admin 走内置口令登录，SSO 走 keycloak）——
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: dataworks
  KEYCLOAK_SSO_CLIENT_ID: dataworks-web
  KEYCLOAK_INTROSPECT_CLIENT_ID: mcp-gateway
  KEYCLOAK_INTROSPECT_CLIENT_SECRET: ${KEYCLOAK_MCP_CLIENT_SECRET:-demo-mcp-client-secret}
  # —— 密钥（必填项；up.sh 生成随机值写入 .env，否则用 demo-* 兜底）——
  PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:-demo-platform-secret-key-change-me}
  PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:-demo-internal-token}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-demo-admin-pass}
  MCP_TOKEN: ${MCP_TOKEN:-demo-mcp-token}
  PLATFORM_PUBLIC_URL: http://localhost:30090
  # —— 出网白名单：compose 网络内的服务名放行 ——
  PLATFORM_EGRESS_ALLOW: doris:9030,doris,s3:9000,s3,postgres:5432,postgres,keycloak:8080
  # —— 演示未含件（见 README「最小依赖表」）：指向 .invalid 主机快速失败，
  #     不再把请求打到作者内网网段（发布面消毒 REQ-OSS-PUBSCRUB-1）——
  PREFECT_BRIDGE_URL: http://prefect-bridge.invalid:4300
  MCP_BASE_URL: http://mcp.invalid:8080
  GRAVITINO_URL: http://gravitino.invalid:8090
  FLINK_GATEWAY_URL: http://flink-sql-gateway.invalid:8083
  FLINK_REST_URL: http://flink-jobmanager.invalid:8081
  SPARK_THRIFT_URL: jdbc:hive2://spark-thrift.invalid:10000/
  PROMETHEUS_URL: http://prometheus.invalid:9090
  AGENT_SERVICE_URL: http://agent-service.invalid:8097
  MOS_BASE_URL: http://mos.invalid:30095
  HDFS_WEBHDFS_URL: http://hdfs.invalid:9870
  PLATFORM_UDF_JAR_BASE_URL: http://backend.invalid:8080

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dataworks_dev}
      POSTGRES_USER: ${DB_USER:-dataworks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-pg-pass}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dataworks} -d ${DB_NAME:-dataworks_dev}"]
      interval: 5s
      timeout: 3s
      retries: 40

  keycloak:
    image: docker.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-demoadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-demo-kc-pass}
      KC_HTTP_ENABLED: "true"
    ports:
      - "30081:8080"

  # 一次性：建 realm dataworks + dataworks-web/mcp-gateway 两个 client（与
  # deploy/tasks/55-keycloak.yml 同语义，幂等；跑完即退）
  keycloak-bootstrap:
    image: docker.io/library/python:3.12-alpine
    depends_on: [keycloak]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-demoadmin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-demo-kc-pass}
      KEYCLOAK_MCP_CLIENT_SECRET: ${KEYCLOAK_MCP_CLIENT_SECRET:-demo-mcp-client-secret}
      DEMO_ORIGIN: http://localhost:30090
    volumes:
      - ./init/keycloak-bootstrap.py:/bootstrap.py:ro
    entrypoint: ["python", "/bootstrap.py"]
    restart: "no"

  # 对象存储：SeaweedFS S3 网关。
  # 为什么不是 MinIO：官方公有镜像与二进制下载已全面停发（2026-11-04 实测
  # hub.docker.com/minio/minio 404、quay.io 0 标签、dl.min.io 410），干净机器拉不到。
  # 后端用的是通用 AWS SDK（path-style 已开启），SeaweedFS 完全兼容。
  # 本地演示凭据固定在 ./s3/s3.json（demoaccesskey/demosecretkey123），只监听本机端口。
  s3:
    image: docker.io/chrislusf/seaweedfs:4.52
    # -s3.port=9000：SeaweedFS S3 网关默认监听 8333，显式对齐后端 S3_ENDPOINT=http://s3:9000
    command: ["server", "-dir=/data", "-ip=s3", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json", "-s3.autoCreateBucket", "-filer"]
    volumes:
      - s3-data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "30900:9000"   # S3 API（多模态预签名走这个端口）
      - "30901:8888"   # Filer 控制台（浏览桶内对象）

  doris:
    image: docker.io/apache/doris:2.1.9-all
    # 两处镜像坑（2026-11-04 实测，均本机复现）：
    # ① entrypoint 末尾 `exec "$@"` 兜底 PID1，空 CMD 时 shell 直接退出、容器 rc=0 暴退 →
    #    给 `sleep infinity` 占住 PID1（FE/BE 是它拉起的子进程，继续存活）。
    # ② BE 启动前校验 vm.max_map_count≥2000000 与「无 swap」，Docker Desktop(WSL2) 两条默认
    #    都过不了（实测 vm=65530、SwapTotal≈1G），且这些是整机 VM 值、普通容器动不了。
    #    演示形态走官方逃生门 SKIP_CHECK_ULIMIT=true 跳过校验（start_be.sh 自带该开关；
    #    本机小数据量下校验值非必需）。同时顺手把 vm 调到 2000000（privileged 可回写 VM 值；
    #    swap 无法在容器内安全关闭，故仍靠 SKIP_CHECK_ULIMIT 兜 swap/nofile 两条）。
    privileged: true
    environment:
      SKIP_CHECK_ULIMIT: "true"
    entrypoint: ["sh", "-c", "sysctl -w vm.max_map_count=2000000 2>/dev/null || true; exec bash /usr/local/bin/entry_point.sh sleep infinity"]
    ports:
      - "30930:9030"   # MySQL 协议（想用自己客户端连数仓时备用）
    volumes:
      - doris-data:/opt/apache-doris/fe/doris-meta
      - doris-be-data:/opt/apache-doris/be/storage

  # 一次性：等 FE 9030 可连后建业务账号（与 50-platform.yml「建 Doris 业务账号」同 SQL）
  doris-init:
    image: docker.io/library/mysql:8.4
    depends_on: [doris]
    environment:
      DORIS_HOST: doris
      DORIS_BIZ_USER: ${DB_USER:-dataworks}
      DORIS_BIZ_PASSWORD: ${DORIS_PASSWORD:-demo-doris-pass}
    volumes:
      - ./init/doris-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/compose/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      # 不等 doris-init：/api/health 与登录只依赖 PG（见 HealthController）；
      # Doris 是数 GB 组件，挂了就让它挂，别把整条判据链卡死（数仓功能如实降级）
    environment: *backend-env

  web:
    build:
      context: ../../web
      dockerfile: ../deploy/compose/Dockerfile.web
      additional_contexts:
        - ops=.
    depends_on: [backend]
    ports:
      - "30090:80"

volumes:
  pg-data:
  s3-data:
  doris-data:
  doris-be-data:
