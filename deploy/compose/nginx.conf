# web 容器：SPA 静态托管 + /api 反代 backend（REQ-OSS-QUICKSTART-1）
# 前端所有后端调用都走 /api/* 前缀（web/src/api.ts），SSO 跳转在后端 /api/auth/sso/**，
# 所以只需代理这一个前缀。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用深链：刷新时回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        # UDF jar 上传：后端上限 50MB/55MB，这里留余量
        client_max_body_size 60m;
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
