---
# 唯一入口：从机器就绪到平台可用。
#
#   ansible-playbook site.yml --check
#   ansible-playbook site.yml
#   ansible-playbook site.yml --tags k3s
#   ansible-playbook site.yml --limit dw-k8s-3
#
# 四个 play：集群节点（远程） → 平台（控制机本地） → 主机服务 agent-service（首节点，须在平台密钥就绪后） → 验收。
# 验收排在 agent-service 之后，否则首装时 8097 还没起来就被 verify 拦下。

- name: 集群节点
  hosts: k3s_cluster
  become: true
  gather_facts: true
  tasks:
    - import_tasks: tasks/10-preflight.yml
      tags: [preflight]
    - import_tasks: tasks/20-node.yml
      tags: [node]
    - import_tasks: tasks/25-artifacts.yml
      tags: [artifacts]
    - import_tasks: tasks/30-k3s.yml
      tags: [k3s]

- name: 平台
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - import_tasks: tasks/50-platform.yml
      tags: [platform]
    - import_tasks: tasks/55-keycloak.yml
      tags: [keycloak]
    - import_tasks: tasks/56-gravitino.yml
      tags: [gravitino]

- name: 主机服务 agent-service（首节点）
  hosts: k3s_init
  become: true
  gather_facts: false
  tasks:
    - import_tasks: tasks/60-agent-service.yml
      tags: [agent-service]

- name: 验收
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - import_tasks: tasks/90-verify.yml
      tags: [verify]
