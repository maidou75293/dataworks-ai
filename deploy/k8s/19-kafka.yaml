# Kafka 3.9 单节点（KRaft，无 ZooKeeper）：Kafka→Doris 采集的源端 DEV 实例。
# 镜像由 scripts/ci/build-kafka-image.sh 构建（复用 Flink 镜像的 Java/bash 基础层）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: dw-dev
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-demo
  namespace: dw-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka-demo
  template:
    metadata:
      labels:
        app: kafka-demo
    spec:
      containers:
        - name: kafka
          image: ${DW_REGISTRY}/library/kafka:3.9.0-r2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/kafka/start-dw.sh"]
          env:
            - name: ADVERTISED_HOST
              value: kafka-demo.dw-dev.svc.cluster.local
            - name: JAVA_HOME
              value: /opt/java
            - name: PATH
              value: /opt/java/bin:/opt/kafka/bin:/usr/local/bin:/usr/bin:/bin
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-demo
  namespace: dw-dev
spec:
  selector:
    app: kafka-demo
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
