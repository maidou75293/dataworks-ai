# DEV: Doris runs as native services on the three VMs (official binary).
# This Service gives in-cluster consumers a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: doris-fe
  namespace: dw-dev
  labels:
    app: doris-fe
spec:
  ports:
    - name: mysql
      port: 9030
      targetPort: 9030
    - name: http
      port: 8030
      targetPort: 8030
---
apiVersion: v1
kind: Endpoints
metadata:
  name: doris-fe
  namespace: dw-dev
  labels:
    app: doris-fe
subsets:
  - addresses:
      - ip: ${DW_NODE1}
    ports:
      - name: mysql
        port: 9030
      - name: http
        port: 8030
