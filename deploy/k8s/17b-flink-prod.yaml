          secret:
            secretName: flink-s3-conf
            defaultMode: 420
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-prod-sql-gateway
  namespace: dw-dev
spec:
  selector:
    app: flink-prod-sql-gateway
  ports:
    - name: rest
      port: 8083
      targetPort: rest
---
# Flink 容器没有 /etc/passwd，Hadoop UGI（S3 文件系统）初始化会失败；
# 这里补一份最小 passwd/group（v447 UDF 的 s3:// jar 依赖它）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-nss
  namespace: dw-dev
data:
  passwd: |
    root:x:0:0:root:/root:/bin/sh
    flink:x:9999:9999:flink:/opt/flink:/bin/sh
  group: |
    root:x:0:
    flink:x:9999:
