  doris.sql_query.schema.json: |
    {
      "name": "doris.sql_query",
      "version": "1.0",
      "description": "执行只读 SQL（仅 SELECT/WITH），限制行数；用于受控分析。",
      "inputSchema": {
        "type": "object",
        "properties": {
          "sql": {
            "type": "string"
          },
          "max_rows": {
            "type": "integer",
            "default": 100,
            "maximum": 1000
          }
        },
        "required": [
          "sql"
        ]
      },
      "outputSchema": {
        "type": "object",
        "properties": {
          "columns": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "rows": {
            "type": "array",
            "items": {
              "type": "array"
            }
          },
          "row_count": {
            "type": "integer"
          }
        }
      },
      "semantics": {
        "preconditions": [
          "user.authorized"
        ],
        "sideEffects": "none",
        "idempotent": true,
        "permissions": [
          "doris.read"
        ],
        "requiresApproval": false,
        "errorCodes": [
          "SQL_NOT_READ_ONLY",
          "SQL_ERROR",
          "DORIS_TIMEOUT"
        ]
      },
      "examples": [
        {
          "input": {
            "sql": "SELECT COUNT(*) FROM kb_dev.kb_chunk",
            "max_rows": 10
          },
          "output": {
            "columns": [
              "count"
            ],
            "rows": [
              [
                100
              ]
            ],
            "row_count": 1
          }
        }
      ]
    }
  embed.query.schema.json: |
    {
      "name": "embed.query",
      "version": "1.0",
      "description": "把文本转成 512 维归一化向量；只读、幂等。",
      "inputSchema": {
        "type": "object",
        "properties": {
          "texts": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 64
          },
          "is_query": {
            "type": "boolean",
            "default": true
          }
        },
        "required": [
          "texts"
        ]
      },
      "outputSchema": {
        "type": "object",
        "properties": {
          "dim": {
            "type": "integer"
          },
          "embeddings": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "number"
              }
            }
          }
        }
      },
      "semantics": {
        "preconditions": [
          "embedding.ready"
        ],
        "sideEffects": "none",
        "idempotent": true,
        "permissions": [
          "embed.use"
        ],
        "requiresApproval": false,
        "errorCodes": [
          "EMBEDDING_UNAVAILABLE",
          "TOO_MANY_TEXTS"
        ]
      },
      "examples": [
        {
          "input": {
            "texts": [
              "报销标准是多少？"
            ],
            "is_query": true
          },
          "output": {
            "dim": 512,
            "embeddings": [
              [
                0.01,
                0.02
              ]
            ]
          }
        }
      ]
    }
