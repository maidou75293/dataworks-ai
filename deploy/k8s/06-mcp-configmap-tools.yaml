          },
          "doc_id": {
            "type": "integer"
          },
          "title": {
            "type": "string"
          },
          "content": {
            "type": "string"
          },
          "acl_tags": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
