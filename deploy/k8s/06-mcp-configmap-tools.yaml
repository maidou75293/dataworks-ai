        "errorCodes": [
          "GRAPH_UNAVAILABLE"
        ]
      },
      "examples": [
        {
          "input": {
            "query": "知识库检索",
            "limit": 3
          },
          "output": {
            "nodes": [
              {
                "id": "kb.search",
                "title": "知识库语义检索",
                "intent": "...",
                "tools": [
                  "embed.query",
                  "doris.vector_search"
                ]
              }
            ]
          }
        }
      ]
