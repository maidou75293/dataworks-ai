apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: dw-dev
data:
  01-databases.sql: |
    -- 只在数据目录为空时执行一次（官方镜像的 initdb.d 机制）。
    -- gravitino_dev 之前是手工建的，全新安装必须在这里建，否则 Gravitino 起不来。
    CREATE DATABASE prefect_dev;
    CREATE DATABASE gravitino_dev;
    CREATE DATABASE keycloak_dev;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dw-dev
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dw-dev
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: ${DW_REGISTRY}/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - name: pg
              containerPort: 5432
          resources:
            requests:
              # 实测 CPU ~6m：500m 的申请会让节点（PV 绑定 dw-k8s-3）调度不上，
              # 平台元数据库 Pending 会直接导致全站 502
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
