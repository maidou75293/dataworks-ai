apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: dw-dev
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # 私有镜像库：节点重调度后不再依赖本机是否 import 过镜像
          image: ${DW_REGISTRY}/library/keycloak:26.0.0-dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /opt/keycloak/bin/kc.sh
            - start-dev
            - --http-port=8080
            - --hostname-strict=false
          env:
            - name: JAVA_HOME
              value: /opt/java
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres.dw-dev.svc.cluster.local:5432/keycloak_dev
            - name: KC_DB_USERNAME
              value: dataworks
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-auth
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              # 实测 CPU 用量 ~1m，原来申请 1 核会把节点 CPU requests 占满导致新 Pod 调度不上
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: dw-dev
  labels:
    app: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
